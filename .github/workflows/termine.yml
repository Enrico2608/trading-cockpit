name: Termine (Tradays) – Test
on:
  push:
    branches: [termine-automatik]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q websockets
      - run: mkdir -p dump && python3 werkzeuge/hl_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump
          git commit -q -m "Testlauf" && git push || echo "nichts zu speichern"
