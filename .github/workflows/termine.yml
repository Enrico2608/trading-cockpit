name: Termine (Tradays) – Test
on:
  push:
    branches: [termine-automatik]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dump && KURSE_ABSTAND=8 python3 werkzeuge/kurse.py dump/kurse --nur GOLD --bis-jahr 2016 --minuten 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump
          git commit -q -m "Testlauf" && git push || echo "nichts zu speichern"
