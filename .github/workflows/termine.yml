name: Termine (Tradays) – Test
on:
  push:
    branches: [termine-automatik]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump
          curl -sSL https://raw.githubusercontent.com/Enrico2608/trading-cockpit/gh-pages/termine.json -o dump/termine_neu.json
          time python3 werkzeuge/termine.py dump/termine_neu.json 2>&1 | tee dump/termine_log.txt
          python3 werkzeuge/termine.py dump/termine_neu.json 2>&1 | tee -a dump/termine_log.txt
          python3 werkzeuge/schlagzeilen.py dump/schlagzeilen.json 2>&1 | tee dump/schlagzeilen_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump
          git commit -q -m "Testlauf" && git push || echo "nichts zu speichern"
