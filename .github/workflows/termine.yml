# Holt jeden Morgen die wichtigen Wirtschaftstermine (Tradays, hoch + mittel) und legt sie als
# termine.json auf die Website (Branch gh-pages). Das Cockpit lädt die Datei beim Öffnen.
# Von Hand starten: GitHub → Actions → „Termine aktualisieren“ → „Run workflow“.
name: Termine aktualisieren
on:
  schedule:
    - cron: '41 4 * * *'      # täglich 4:41 UTC = 5:41 Uhr (Winter) bzw. 6:41 Uhr (Sommer) in Deutschland
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: termine
  cancel-in-progress: false
jobs:
  termine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skript holen
        uses: actions/checkout@v4
        with:
          path: quelle
      - name: Website holen
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Termine bei Tradays laden
        run: python3 quelle/werkzeuge/termine.py site/termine.json
      - name: Speichern, wenn sich etwas geändert hat
        working-directory: site
        run: |
          git add termine.json
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Termine aktualisiert (Tradays)"
          for i in 1 2 3; do git pull -q --rebase origin gh-pages && git push -q origin HEAD:gh-pages && exit 0; sleep 15; done
          exit 1
