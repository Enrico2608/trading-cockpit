# Holt werktags alle 2 Stunden die wichtigen Wirtschaftstermine (Tradays + ForexFactory, hoch + mittel, mit den betroffenen
# Märkten) und die Schlagzeilen je Markt (Google News) und legt sie als termine.json und schlagzeilen.json auf die Website
# (Branch gh-pages). Das Cockpit lädt beide Dateien beim Öffnen.
# Von Hand starten: GitHub → Actions → „Termine aktualisieren“ → „Run workflow“.
name: Termine aktualisieren
on:
  schedule:
    - cron: '41 4-20/2 * * 1-5'   # Mo–Fr 4:41 bis 20:41 UTC alle 2 Stunden (5:41–21:41 Uhr im Winter)
    - cron: '41 15 * * 0'         # Sonntag 16:41 Uhr: die neue Woche
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: termine
  cancel-in-progress: false
jobs:
  termine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skript holen
        uses: actions/checkout@v4
        with:
          path: quelle
      - name: Website holen
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Termine bei Tradays und ForexFactory laden
        continue-on-error: true
        run: python3 quelle/werkzeuge/termine.py site/termine.json
      - name: Schlagzeilen je Markt laden (Google News)
        continue-on-error: true
        run: python3 quelle/werkzeuge/schlagzeilen.py site/schlagzeilen.json
      - name: Speichern, wenn sich etwas geändert hat
        working-directory: site
        run: |
          for f in termine.json schlagzeilen.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Termine und Schlagzeilen aktualisiert"
          for i in 1 2 3; do git pull -q --rebase origin gh-pages && git push -q origin HEAD:gh-pages && exit 0; sleep 15; done
          exit 1
